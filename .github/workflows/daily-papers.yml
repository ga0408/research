name: Daily Papers

on:
  workflow_dispatch:
    inputs:
      date:
        description: '날짜 (YYYY-MM-DD). 비워두면 어제.'
        required: false
        type: string
  schedule:
    # 2 AM UTC = 11 AM KST, 매일 (전일 분 데일리 페이퍼)
    - cron: '0 2 * * *'

permissions:
  contents: write
  issues: write

jobs:
  fetch-and-summarize:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch papers & generate summary
        env:
          # 4개 endpoint를 세미콜론으로 결합 → 스크립트가 순차 시도 (failover)
          LLM_ENDPOINTS: ${{ secrets.LLM_ENDPOINT_1 }};${{ secrets.LLM_ENDPOINT_2 }};${{ secrets.LLM_ENDPOINT_3 }};${{ secrets.LLM_ENDPOINT_4 }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'glm-5.2' }}
        run: |
          set -euo pipefail
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          python scripts/daily_papers.py $DATE_ARG

      - name: Commit to main & create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILE=$(ls -t daily/*.md 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "ERROR: 생성된 파일이 없습니다."
            exit 1
          fi
          PAPER_DATE=$(basename "$FILE" .md)

          # main에 직접 커밋
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "daily: ${PAPER_DATE} HF Daily Papers 요약 추가" || true
          git push origin main

          # Issue 생성 (본문 = 파일 내용, 체크박스 클릭 가능)
          gh issue create \
            --title "Daily Papers: ${PAPER_DATE}" \
            --body-file "$FILE" \
            --label "daily-papers" 2>/dev/null || \
          gh issue create \
            --title "Daily Papers: ${PAPER_DATE}" \
            --body-file "$FILE"
